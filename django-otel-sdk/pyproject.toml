[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-otel-sdk"
version = "0.1.0"
description = "OpenTelemetry SDK for Django applications"
authors = [
    { name = "Datadog Replacement Team", email = "engineering@example.com" }
]
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-api==1.33.0",
    "opentelemetry-sdk==1.33.0",
    "opentelemetry-exporter-otlp==1.33.0",
    "opentelemetry-instrumentation-django==0.54b0",
    "opentelemetry-instrumentation-psycopg2==0.54b0",
    "opentelemetry-instrumentation-redis==0.54b0",
    "opentelemetry-instrumentation-requests==0.54b0",
    "opentelemetry-instrumentation-wsgi==0.54b0"
]

[project.urls]
"Homepage" = "https://example.com"
