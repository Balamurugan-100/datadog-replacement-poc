services:
  postgres:
    image: postgres:16
    container_name: django-otel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_otel}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${POSTGRES_DB:-django_otel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - observability

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: django-otel-pgbouncer
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/pg_hba.conf:/etc/pgbouncer/pg_hba.conf:ro
      - pgbouncer_log:/var/log/pgbouncer
    entrypoint: ["sh", "-c", "rm -f /tmp/pgbouncer.pid /var/log/pgbouncer/pgbouncer.pid && exec /opt/pgbouncer/pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    networks:
      - default
      - observability
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: django-otel-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - observability

  slave1db:
    image: postgres:16
    container_name: django-otel-slave1db
    environment:
      POSTGRES_DB: ${SLAVE1_DB_NAME:-django_otel_slave1}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django}
    ports:
      - "${SLAVE1_PORT:-5434}:5432"
    volumes:
      - slave1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${SLAVE1_DB_NAME:-django_otel_slave1}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - observability

  slave2db:
    image: postgres:16
    container_name: django-otel-slave2db
    environment:
      POSTGRES_DB: ${SLAVE2_DB_NAME:-django_otel_slave2}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django}
    ports:
      - "${SLAVE2_PORT:-5435}:5432"
    volumes:
      - slave2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${SLAVE2_DB_NAME:-django_otel_slave2}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - observability

  slave3db:
    image: postgres:16
    container_name: django-otel-slave3db
    environment:
      POSTGRES_DB: ${SLAVE3_DB_NAME:-django_otel_slave3}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django}
    ports:
      - "${SLAVE3_PORT:-5436}:5432"
    volumes:
      - slave3_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${SLAVE3_DB_NAME:-django_otel_slave3}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - observability

  external-api:
    image: mccutchen/go-httpbin:v2.14.0
    container_name: django-otel-external-api
    ports:
      - "${EXTERNAL_API_PORT:-8080}:8080"
    networks:
      - default
      - observability

  web:
    build: .
    container_name: django-otel-web
    command: sh -c "python manage.py setup_databases && gunicorn config.wsgi:application --config gunicorn.conf.py --reload"
    volumes:
      - .:/app
      - static_files:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DJANGO_DB_HOST=${DJANGO_DB_HOST:-pgbouncer}
      - DJANGO_DB_PORT=${DJANGO_DB_PORT:-6432}
      - DJANGO_DB_NAME=${POSTGRES_DB:-django_otel}
      - DJANGO_DB_USER=${POSTGRES_USER:-django}
      - DJANGO_DB_PASSWORD=${POSTGRES_PASSWORD:-django}
      - SLAVE1_DB_HOST=${SLAVE1_DB_HOST:-slave1db}
      - SLAVE1_DB_PORT=${SLAVE1_DB_PORT:-5432}
      - SLAVE1_DB_NAME=${SLAVE1_DB_NAME:-django_otel_slave1}
      - SLAVE2_DB_HOST=${SLAVE2_DB_HOST:-slave2db}
      - SLAVE2_DB_PORT=${SLAVE2_DB_PORT:-5432}
      - SLAVE2_DB_NAME=${SLAVE2_DB_NAME:-django_otel_slave2}
      - SLAVE3_DB_HOST=${SLAVE3_DB_HOST:-slave3db}
      - SLAVE3_DB_PORT=${SLAVE3_DB_PORT:-5432}
      - SLAVE3_DB_NAME=${SLAVE3_DB_NAME:-django_otel_slave3}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-http://external-api:8080/get}
      - DJANGO_REDIS_URL=${DJANGO_REDIS_URL:-redis://redis:6379/1}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-django}
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-development}
      - OTEL_APPLICATION=${OTEL_APPLICATION:-django-otel}
      - OTEL_BATCH_DELAY_MS=${OTEL_BATCH_DELAY_MS:-2000}
      - OTEL_BATCH_MAX_SIZE=${OTEL_BATCH_MAX_SIZE:-256}
      - OTEL_BATCH_QUEUE_SIZE=${OTEL_BATCH_QUEUE_SIZE:-2048}
      - OTEL_FLUSH_TIMEOUT_MS=${OTEL_FLUSH_TIMEOUT_MS:-5000}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
    networks:
      - default
      - observability
    depends_on:
      pgbouncer:
        condition: service_started
      slave1db:
        condition: service_healthy
      slave2db:
        condition: service_healthy
      slave3db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./nginx
    container_name: django-otel-nginx
    ports:
      - "${NGINX_PORT:-8001}:80"
    volumes:
      - static_files:/app/staticfiles:ro
    networks:
      - default
      - observability
    depends_on:
      - web

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: django-otel-collector
    environment:
      - TEMPO_ENDPOINT=${TEMPO_ENDPOINT:-tempo:4317}
      - OTEL_LOG_LEVEL=${OTEL_COLLECTOR_LOG_LEVEL:-warn}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    networks:
      - observability
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.6.1
    container_name: django-otel-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - observability
    restart: unless-stopped
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:latest
    container_name: django-otel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability
    restart: unless-stopped
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: django-otel-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANON_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANON_ROLE:-Admin}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/2_datadog_apm.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - tempo
      - prometheus

volumes:
  postgres_data:
  slave1_data:
  slave2_data:
  slave3_data:
  static_files:
  pgbouncer_log:
  tempo-data:
  grafana-data:

networks:
  observability:
    driver: bridge