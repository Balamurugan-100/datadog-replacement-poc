<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem; border: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; }
        a { color: #0066cc; }
    </style>
</head>
<body>
    <h1>Products</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>${{ product.price }}</td>
                <td>{{ product.stock }}</td>
                <td>{{ product.created_at|date:"Y-m-d H:i" }}</td>
                <td><a href="{% url 'product-detail-tmpl' product.id %}">View</a></td>
            </tr>
            {% empty %}
            <tr><td colspan="6">No products</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="/api/products/">API List</a></p>
</body>
</html>
